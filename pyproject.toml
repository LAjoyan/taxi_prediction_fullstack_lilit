[project]
name = "taxipred"
version = "0.1.0"
description = "Fullstack ML application for predicting taxi prices"
readme = "README.md"
authors = [
    { name = "LAjoyan", email = "ajoyan.lilit@gmail.com" }
]
requires-python = ">=3.12" # Note: Changed to 3.12 for better server compatibility
dependencies = [
    "fastapi>=0.115.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "uvicorn>=0.23.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
]

# Move the heavy stuff here - Vercel will ignore these!
[dependency-groups]
dev = [
    "seaborn>=0.13.2",
    "streamlit>=1.30.0",
    "streamlit-folium>=0.17.0",
    "folium>=0.15.0",
    "ipykernel>=6.0.0",
]

[tool.fastapi]
entrypoint = "src/taxipred/backend/api.py"